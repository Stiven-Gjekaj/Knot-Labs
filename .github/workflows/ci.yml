name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies (minimal)
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy pydantic pillow ffmpeg-python faster-whisper rapidfuzz
      - name: Run tests
        run: pytest -q

  gui_fix:
    name: Windows GUI Fix (PySimpleGUI, optional)
    continue-on-error: true
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Run GUI fix script
        run: python scripts/reinstall_pysimplegui.py
      - name: Validate PySimpleGUI import
        run: python - << 'PY'
          import importlib
          m = importlib.import_module('PySimpleGUI')
          assert hasattr(m, 'Window'), 'PySimpleGUI missing Window attribute'
          print('PySimpleGUI OK')
          PY
