 [build-system]
 requires = ["setuptools>=61", "wheel"]
 build-backend = "setuptools.build_meta"

[project]
name = "veil"
 version = "0.1.0"
 description = "Zero-shot audio+video classifier using CLIP and Faster-Whisper"
 readme = "README.md"
 requires-python = ">=3.10"
authors = [{ name = "Veil Contributors" }]
 dependencies = [
   "ftfy",
   "regex",
   "tqdm",
   "opencv-python",
   "pillow",
   "ffmpeg-python",
   "faster-whisper",
   "torch",
   "torchvision",
   "torchaudio",
   "clip @ git+https://github.com/openai/CLIP.git",
 ]

[project.scripts]
veil = "veil.classify_veil:main"

[tool.setuptools]
package-dir = {"" = "src"}

 [tool.setuptools.packages.find]
 where = ["src"]

