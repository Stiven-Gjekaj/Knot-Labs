<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Knot-Labs Web UI</title>
  <style>
    :root {
      --bg: #0b0b0e;
      --surface: #111113;
      --card: #141416;
      --input: #1a1b1f;
      --border: #23242a;
      --primary: #f87171;      /* light red accent */
      --primary-600: #ef4444;
      --primary-700: #dc2626;
      --accent: #fca5a5;       /* soft red */
      --text: #e5e7eb;
      --muted: #9ca3af;
      --success: #22c55e;
      --error: #ef4444;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      margin: 0; padding: 0; color: var(--text);
      background: radial-gradient(1200px 800px at 20% -10%, #1a1012 0%, var(--bg) 50%) fixed,
                  linear-gradient(180deg, #0f1115 0%, #0b0b0e 100%);
    }
    .container { max-width: 1024px; margin: 24px auto 48px auto; padding: 0 16px; }
    h1 { font-size: 24px; letter-spacing: 0.5px; margin: 0 0 16px 0; color: #ffd7dc; }
    fieldset {
      margin: 18px 0; padding: 14px 16px 18px 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.25);
    }
    legend {
      padding: 0 8px; color: #ffd7dc; font-weight: 600; letter-spacing: 0.3px;
    }
    label { display: inline-block; min-width: 220px; color: #e9e9ea; }
    input[type="text"], input[type="number"], input[type="file"], select {
      width: 320px; max-width: 100%; color: var(--text);
      background: var(--input); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 10px; outline: none; transition: all 120ms ease;
    }
    input[type="text"]:focus, input[type="number"]:focus, select:focus {
      border-color: var(--primary); box-shadow: 0 0 0 3px rgba(200,30,45,0.25);
    }
    button {
      margin-right: 8px; background: var(--primary-600); color: white; border: 1px solid var(--primary-700);
      padding: 8px 12px; border-radius: 8px; cursor: pointer; font-weight: 600;
      transition: transform 80ms ease, background 120ms ease, box-shadow 120ms ease;
      box-shadow: 0 4px 10px rgba(200,30,45,0.25);
    }
    button:hover { background: var(--primary); }
    button:active { transform: translateY(1px); }
    .row { margin: 8px 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    a { color: #ff7b88; }
    .ok { color: var(--success); }
    .err { color: var(--error); }
    .muted { color: var(--muted); }
    #previewPane { margin-top: 10px; border: 1px dashed var(--border); border-radius: 10px; padding: 8px; background: #1a1113; }
    #previewPane video, #previewPane audio, #previewPane img { max-width: 100%; max-height: 420px; display: block; border-radius: 8px; }
    #log { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px; max-height: 300px; overflow: auto; }
    .grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
    @media (min-width: 980px) { .grid { grid-template-columns: 1fr 1fr; } }
    /* Compact mode */
    body.compact h1 { font-size: 20px; }
    body.compact fieldset { padding: 10px 12px 12px 12px; border-radius: 10px; }
    body.compact label { min-width: 180px; }
    body.compact input[type="text"], body.compact input[type="number"], body.compact input[type="file"], body.compact select { width: 260px; padding: 6px 8px; }
    body.compact button { padding: 6px 10px; }
    body.compact .row { margin: 6px 0; gap: 8px; }
    body.compact #previewPane { padding: 6px; }
    body.compact #log { max-height: 220px; }
    /* Light theme overrides */
    body.theme-light { --bg:#fafafa; --surface:#ffffff; --card:#ffffff; --input:#ffffff; --border:#e5e7eb; --primary:#b91c1c; --primary-600:#991b1b; --primary-700:#7f1d1d; --accent:#dc2626; --text:#1f2937; --muted:#6b7280; --success:#16a34a; --error:#dc2626; }
    /* Toasts */
    .toast-container { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 9999; }
    .toast { background: var(--card); color: var(--text); border: 1px solid var(--border); border-left: 4px solid var(--primary); padding: 10px 12px; border-radius: 10px; box-shadow: 0 6px 18px rgba(0,0,0,0.25); opacity: 0.98; }
    .toast.ok { border-left-color: var(--success); }
    .toast.error { border-left-color: var(--error); }
    .toast .muted { color: var(--muted); }
  </style>
  <script>
    let apiBase = '';
    let compact = false;
    function headers(json=true) {
      const h = {};
      if (json) h['content-type'] = 'application/json';
      return h;
    }
function applyTheme(t) {
  const theme = (t === 'light') ? 'light' : 'dark';
  document.body.classList.toggle('theme-light', theme === 'light');
  try { localStorage.setItem('knot_theme', theme); } catch {}
}
function onThemeToggle(el) { applyTheme((el && el.checked) ? 'dark' : 'light'); }
function onAutoTreeToggle(el){ try { localStorage.setItem('knot_auto_tree', (el && el.checked) ? '1' : '0'); } catch {} }
    function onAccordionToggle(el){ try { localStorage.setItem('knot_accordion', (el && el.checked) ? '1' : '0'); } catch {} }

    // Categories Tree: fetch and render macros -> mesos -> micros -> nanos
    async function loadCategoriesTree() {
      try {
        const r = await api('/categories/tree');
        if (!r.ok) {
          log('error', 'Failed to load categories tree: ' + (r.error || r.status));
          return;
        }
        const data = r.data || {};
        const cont = document.getElementById('catTree');
        cont.innerHTML = '';
        // Build as nested lists for readability
        const ul = document.createElement('ul');
        ul.style.listStyle = 'none';
        ul.style.paddingLeft = '0';
        function addItem(parent, text) {
          const li = document.createElement('li');
          li.textContent = text;
          parent.appendChild(li);
          return li;
        }
        Object.keys(data).forEach((macro) => {
          const macroLi = addItem(ul, macro);
          const mesos = data[macro] || {};
          const mesoUl = document.createElement('ul');
          mesoUl.style.listStyle = 'disc';
          mesoUl.style.paddingLeft = '18px';
          macroLi.appendChild(mesoUl);
          Object.keys(mesos).forEach((meso) => {
            const mesoLi = addItem(mesoUl, meso);
            const microValue = mesos[meso];
            const microUl = document.createElement('ul');
            microUl.style.listStyle = 'circle';
            microUl.style.paddingLeft = '18px';
            mesoLi.appendChild(microUl);
            if (Array.isArray(microValue)) {
              // Legacy/basic tree: list of micros
              microValue.forEach((mi) => addItem(microUl, mi));
            } else if (microValue && typeof microValue === 'object') {
              // Extended tree: map micro -> nanos[]
              Object.keys(microValue).forEach((mi) => {
                const miLi = addItem(microUl, mi);
                const nanos = Array.isArray(microValue[mi]) ? microValue[mi] : [];
                if (nanos.length > 0) {
                  const nanoUl = document.createElement('ul');
                  nanoUl.style.listStyle = 'square';
                  nanoUl.style.paddingLeft = '18px';
                  miLi.appendChild(nanoUl);
                  nanos.forEach((na) => addItem(nanoUl, na));
                }
              });
            }
          });
        });
        cont.appendChild(ul);
        log('ok', 'Loaded categories tree');
      } catch (e) {
        log('error', 'Load categories error: ' + e);
      }
    }

function slugifyTitle(s){ try { return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''); } catch { return ''; } }
function allFieldsets(){ return Array.from(document.querySelectorAll('fieldset')); }
function ensurePanelIds(){ allFieldsets().forEach((fs,idx)=>{ if(!fs.id){ const lg=fs.querySelector('legend'); const t = lg?lg.textContent:('panel-'+(idx+1)); fs.id = 'panel-'+slugifyTitle(t)+'-'+idx; } }); }
function savePanelState(){ try { const collapsed = allFieldsets().filter(fs=>fs.classList.contains('collapsed')).map(fs=>fs.id); localStorage.setItem('knot_panels', JSON.stringify(collapsed)); } catch{} }
function loadPanelState(){ try { const raw = localStorage.getItem('knot_panels'); if(!raw) return; const arr = JSON.parse(raw)||[]; allFieldsets().forEach(fs=>{ if(arr.includes(fs.id)){ fs.classList.add('collapsed'); } else { fs.classList.remove('collapsed'); } }); } catch{} }
function attachCollapsers(){ allFieldsets().forEach(fs=>{ fs.classList.add('collapsible'); const lg = fs.querySelector('legend'); if(lg && !lg.dataset.bound){ lg.dataset.bound = '1'; lg.addEventListener('click',()=>{ fs.classList.toggle('collapsed'); const acc = (localStorage.getItem('knot_accordion')==='1'); if(acc && !fs.classList.contains('collapsed')){ allFieldsets().forEach(other=>{ if(other!==fs){ other.classList.add('collapsed'); } }); } savePanelState(); }); } }); }
function collapseAll(){ allFieldsets().forEach(fs=>fs.classList.add('collapsed')); savePanelState(); }
function expandAll(){ allFieldsets().forEach(fs=>fs.classList.remove('collapsed')); savePanelState(); }
function resetUI() {
  try { localStorage.removeItem('knot_compact'); } catch {}
  const chk = document.getElementById('compactToggle');
  if (chk) { chk.checked = false; }
  applyCompact(false);
  showToast('ok', 'UI settings reset');
  log('ok', 'UI settings reset');
}
    function applyCompact(c) {
      compact = !!c;
      document.body.classList.toggle('compact', compact);
      try { localStorage.setItem('knot_compact', compact ? '1' : '0'); } catch {}
    }
    function onCompactToggle(el) { applyCompact(!!el.checked); }
    async function testApi() {
      try {
        const r = await api('/ping', { headers: headers(false) });
        const body = (typeof r.data === 'string') ? r.data : JSON.stringify(r.data);
        log(r.status === 200 ? 'ok' : 'error', 'API test (' + r.status + '): ' + body);
      } catch (e) {
        log('error', 'API test error: ' + e);
      }
    }
    async function testCors() {
      const base = apiBase || '';
      try {
        const r = await fetch(base + '/ping', {
          method: 'GET',
          mode: 'cors',
        });
        const allowOrigin = r.headers.get('access-control-allow-origin');
        const allowMethods = r.headers.get('access-control-allow-methods');
        const allowHeaders = r.headers.get('access-control-allow-headers');
        let msg = 'CORS test: status=' + r.status;
        if (allowOrigin || allowMethods || allowHeaders) {
          msg += ' | ACO=' + (allowOrigin || '-') + ' ACM=' + (allowMethods || '-') + ' ACH=' + (allowHeaders || '-');
        } else {
          msg += ' | CORS OK (headers not exposed)';
        }
        log((r.ok ? 'ok' : 'error'), msg);
      } catch (e) {
        log('error', 'CORS test error: ' + e);
      }
    }
    async function testRedis() {
      try {
        const r = await api('/health/redis', { headers: headers(false) });
        const body = (typeof r.data === 'string') ? r.data : JSON.stringify(r.data);
        log(r.status === 200 ? 'ok' : 'error', 'Redis test (' + r.status + '): ' + body);
      } catch (e) {
        log('error', 'Redis test error: ' + e);
      }
    }
function log(level, msg) {
      const out = document.getElementById('log');
      const t = new Date().toISOString().replace('T',' ').replace('Z','');
      const span = document.createElement('div');
      span.className = level === 'error' ? 'err' : (level === 'ok' ? 'ok' : 'muted');
      span.textContent = '['+t+'] ' + msg;
  out.prepend(span);
  if (level === 'ok' || level === 'error') {
    showToast(level, msg);
  }
}
function logLink(level, prefix, href, text) {
      const out = document.getElementById('log');
      const t = new Date().toISOString().replace('T',' ').replace('Z','');
      const div = document.createElement('div');
      div.className = level === 'error' ? 'err' : (level === 'ok' ? 'ok' : 'muted');
      div.append(document.createTextNode('['+t+'] ' + (prefix || '')));
      const a = document.createElement('a');
      a.href = href; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.textContent = text || href;
      div.append(document.createTextNode(' '));
      div.append(a);
  out.prepend(div);
  if (level === 'ok' || level === 'error') {
    showToast(level, (prefix || '') + ' ' + (text || href));
  }
}
function showToast(level, msg, timeoutMs = 3500) {
  const cont = document.getElementById('toasts');
  if (!cont) return;
  const el = document.createElement('div');
  el.className = 'toast ' + (level === 'error' ? 'error' : (level === 'ok' ? 'ok' : ''));
  el.textContent = msg;
  cont.appendChild(el);
  setTimeout(() => { try { el.style.transition = 'opacity 300ms ease'; el.style.opacity = '0'; } catch {} }, Math.max(500, timeoutMs - 300));
  setTimeout(() => { try { cont.removeChild(el); } catch {} }, timeoutMs);
}
    async function api(path, opts={}) {
      const url = (apiBase || '') + (path.startsWith('/') ? path : ('/'+path));
      const resp = await fetch(url, opts);
      const text = await resp.text();
      try { return { status: resp.status, data: JSON.parse(text) }; }
      catch { return { status: resp.status, data: text }; }
    }

    // Users
    function setUserContext(user, message) {
      if (!user) { return; }
      const userId = user.userID || user.userId || user.id || '';
      const username = user.username || '';
      const nameInput = document.getElementById('userName');
      if (nameInput) { nameInput.value = username; }
      const genderField = document.getElementById('userGender');
      if (genderField) {
        const g = (user.Gender || user.gender || '').toLowerCase();
        genderField.value = ['female','male','other'].includes(g) ? g : '';
      }
      const countryField = document.getElementById('userCountry');
      if (countryField) {
        const c = (user.country || user.Country || '').toUpperCase();
        const hasOption = Array.from(countryField.options || []).some(opt => opt.value === c);
        countryField.value = hasOption ? c : '';
      }
      if (userId) {
        ['creator','viewer','activeUser'].forEach((id) => {
          const el = document.getElementById(id);
          if (el) { el.value = userId; }
        });
      }
      const label = username || userId || 'user';
      if (message) {
        log('ok', message + ': ' + label);
        showToast('ok', message + ': ' + label);
      }
    }

    async function ensureUser() {
      const nameInput = document.getElementById('userName');
      const username = (nameInput && nameInput.value ? nameInput.value : '').trim();
      if (!username) {
        log('error', 'Enter a username to continue');
        showToast('error', 'Username required');
        return;
      }
      const gender = (document.getElementById('userGender').value || '').trim();
      const country = document.getElementById('userCountry').value || '';
      try {
        const existing = await api('/users/' + encodeURIComponent(username), { headers: headers(false) });
        if (existing.status === 200 && existing.data) {
          setUserContext(existing.data, 'Logged in');
          return;
        }
        if (existing.status && existing.status !== 404) {
          log('error', 'Lookup user failed: ' + JSON.stringify(existing.data));
          showToast('error', 'Lookup failed');
          return;
        }
      } catch (e) {
        log('error', 'Lookup user error: ' + e);
        showToast('error', 'Lookup error');
        return;
      }
      const body = JSON.stringify({
        username: username,
        gender: gender || null,
        country: country || null,
      });
      const created = await api('/users', { method: 'POST', headers: headers(true), body });
      if (created.status === 200 && created.data) {
        setUserContext(created.data, 'Created user');
      } else {
        log('error', 'Create user failed: ' + JSON.stringify(created.data));
        showToast('error', 'Create user failed');
      }
    }

    // Posts + Analyze
    async function createPostAnalyze() {
      const creator = document.getElementById('creator').value.trim();
      const mediaInput = document.getElementById('mediaPath');
      const desc = document.getElementById('description').value.trim();
      const country = document.getElementById('postCountry').value || '';
      const fileInput = document.getElementById('mediaFile');
      const selectedFiles = (fileInput && fileInput.files) ? Array.from(fileInput.files) : [];

      if (!creator) {
        log('error', 'Provide a creator (user ID or username) before posting');
        return;
      }

      const postWithMedia = async (mediaPath, label = '') => {
        const body = JSON.stringify({
          creator,
          media_path: mediaPath || null,
          description: desc || null,
          country: country || null,
        });
        const prefix = label ? label + ' ' : '';
        const r = await api('/posts', { method: 'POST', headers: headers(true), body });
        const success = r.status === 200;
        log(success ? 'ok' : 'error', prefix + 'Create post: ' + JSON.stringify(r.data));
        if (success && mediaInput) {
          mediaInput.value = '';
        }
        if (r.status === 200 && r.data && r.data.job_id) {
          const job = r.data.job_id;
          log('info', prefix + 'Polling job ' + job);
          let baseDelay = 1200;
          let maxDelay = 8000;
          const poll = async (delay) => {
            try {
              const s = await api('/jobs/' + encodeURIComponent(job), { headers: headers(false) });
              if (s.status === 429) {
                // Back off on rate limit
                const next = Math.min(maxDelay, Math.floor((delay || baseDelay) * 1.7));
                log('info', prefix + 'Job ' + job + ': Too Many Requests; backing off to ' + next + 'ms');
                setTimeout(() => poll(next), next);
                return;
              }
              log('info', prefix + 'Job ' + job + ': ' + JSON.stringify(s.data));
              if (s.data && (s.data.status === 'done' || s.data.status === 'error')) {
                return; // stop polling
              }
              setTimeout(() => poll(baseDelay), baseDelay);
            } catch (e) {
              const next = Math.min(maxDelay, Math.floor((delay || baseDelay) * 1.7));
              log('error', prefix + 'Job ' + job + ' poll error; retrying in ' + next + 'ms: ' + e);
              setTimeout(() => poll(next), next);
            }
          };
          poll(baseDelay);
        }
      };

      if (selectedFiles.length > 0) {
        const total = selectedFiles.length;
        if (total > 1) {
          log('info', 'Uploading and creating posts for ' + total + ' files');
        }
        for (let i = 0; i < total; i++) {
          const file = selectedFiles[i];
          const label = total > 1 ? '(' + (i + 1) + '/' + total + ')' : '';
          const uploaded = await uploadFileBlob(file, {
            silent: true,
            updateInputs: true,
            showPreview: i === total - 1,
            label,
          });
          if (!uploaded || !uploaded.path) {
            log('error', (label ? label + ' ' : '') + 'Skipping post creation due to upload failure');
            continue;
          }
          await postWithMedia(uploaded.path, label);
        }
        try { if (fileInput) { fileInput.value = ''; } } catch {}
        return;
      }

      const media = (mediaInput && mediaInput.value ? mediaInput.value : '').trim();
      if (!media) {
        log('error', 'Select a media file or provide a server media path before posting');
        return;
      }

      await postWithMedia(media);
    }

    async function uploadFileBlob(file, { silent = false, updateInputs = true, showPreview = null, label = '' } = {}) {
      if (!file) {
        if (!silent) {
          log('error', (label ? label + ' ' : '') + 'No file provided for upload');
        }
        return null;
      }
      if (showPreview === null) {
        showPreview = updateInputs;
      }
      const fd = new FormData();
      fd.append('file', file);
      try {
        const base = apiBase || '';
        const resp = await fetch(base + '/upload', { method: 'POST', headers: headers(false), body: fd });
        const txt = await resp.text();
        let data = null;
        try { data = JSON.parse(txt); } catch (e) { data = { raw: txt }; }
        if (resp.ok && data && data.path) {
          const mp = document.getElementById('mediaPath');
          if (updateInputs && mp) {
            mp.value = data.path;
          }
          const level = silent ? 'info' : 'ok';
          const verb = silent ? 'Auto-uploaded' : 'Uploaded';
          const sizeInfo = (typeof data.size === 'number') ? ' (' + data.size + ' bytes)' : '';
          const name = data.filename ? ' ' + data.filename : (file && file.name ? ' ' + file.name : '');
          const prefix = label ? label + ' ' : '';
          log(level, prefix + verb + name + ' -> ' + data.path + sizeInfo);
          if (data.filename) {
            const baseUrl = apiBase || '';
            const url = baseUrl + '/uploads/' + encodeURIComponent(data.filename);
            logLink(level, prefix + 'Preview:', url, 'Open');
            if (showPreview) {
              setPreview(data.filename, data.mime || '');
            }
          }
          return data;
        }
        const failure = txt;
        const prefix = label ? label + ' ' : '';
        log('error', prefix + (silent ? 'Auto-upload failed: ' : 'Upload failed: ') + failure);
        return null;
      } catch (e) {
        const prefix = label ? label + ' ' : '';
        log('error', prefix + (silent ? 'Auto-upload error: ' : 'Upload error: ') + e);
        return null;
      }
    }

    async function uploadSelectedFile({ silent = false } = {}) {
      const inp = document.getElementById('mediaFile');
      if (!inp || !inp.files || inp.files.length === 0) {
        if (!silent) {
          log('error', 'Select a file to upload');
        }
        return null;
      }
      const files = Array.from(inp.files);
      let lastResult = null;
      for (let i = 0; i < files.length; i++) {
        const label = files.length > 1 ? '(' + (i + 1) + '/' + files.length + ')' : '';
        lastResult = await uploadFileBlob(files[i], {
          silent,
          updateInputs: i === files.length - 1,
          showPreview: i === files.length - 1,
          label,
        });
      }
      try { inp.value = ''; } catch {}
      return lastResult;
    }

    async function uploadMedia() {
      await uploadSelectedFile({ silent: false });
    }

    function fileExt(name) {
      const i = name.lastIndexOf('.');
      return i >= 0 ? name.substring(i+1).toLowerCase() : '';
    }
    function setPreview(filename, mime) {
      const base = apiBase || '';
      const url = base + '/uploads/' + encodeURIComponent(filename);
      const ext = fileExt(filename);
      const v = document.getElementById('previewVideo');
      const a = document.getElementById('previewAudio');
      const img = document.getElementById('previewImage');
      const link = document.getElementById('previewLink');
      // Hide all first
      v.style.display = 'none'; v.removeAttribute('src'); v.load && v.load();
      a.style.display = 'none'; a.removeAttribute('src'); a.load && a.load();
      img.style.display = 'none'; img.removeAttribute('src');
      link.style.display = 'none'; link.removeAttribute('href');
      // Decide element to use
      const videoExts = ['mp4','webm','ogg','ogv','mkv','mov'];
      const audioExts = ['mp3','wav','ogg','oga','m4a','aac'];
      const imageExts = ['jpg','jpeg','png','gif','webp'];
      // Prefer server-reported MIME if available
      if ((mime || '').startsWith('video/')) {
        v.src = url; v.style.display = 'block';
      } else if ((mime || '').startsWith('audio/')) {
        a.src = url; a.style.display = 'block';
      } else if ((mime || '').startsWith('image/')) {
        img.src = url; img.style.display = 'block';
      } else if (videoExts.includes(ext)) {
        v.src = url; v.style.display = 'block';
      } else if (audioExts.includes(ext)) {
        a.src = url; a.style.display = 'block';
      } else if (imageExts.includes(ext)) {
        img.src = url; img.style.display = 'block';
      }
      // Always provide a link fallback
      link.href = url; link.textContent = 'Open in new tab'; link.style.display = 'inline';
    }

    // Interactions
    async function interact(action) {
      const viewer = document.getElementById('viewer').value.trim();
      const author = document.getElementById('author').value.trim();
      const post = document.getElementById('postId').value.trim();
      const amount = parseFloat(document.getElementById('giftAmt').value || '0');
      const body = JSON.stringify({ viewer, creator: author, post, amount });
      const r = await api('/interactions/' + encodeURIComponent(action), { method: 'POST', headers: headers(true), body });
      log(r.status === 200 ? 'ok' : 'error', 'Interaction ' + action + ': ' + JSON.stringify(r.data));
    }

    // Rank
    async function rankUser() {
      const user = document.getElementById('activeUser').value.trim();
      const k = parseInt(document.getElementById('rankK').value || '20', 10);
      const r = await api('/rank?user=' + encodeURIComponent(user) + '&k=' + k, { headers: headers(false) });
      log(r.status === 200 ? 'ok' : 'error', 'Rank results: ' + JSON.stringify(r.data));
    }

    // Search
    async function doSearch() {
      const q = document.getElementById('searchQ').value.trim();
      const k = parseInt(document.getElementById('searchK').value || '10', 10);
      const r = await api('/search?q=' + encodeURIComponent(q) + '&k=' + k, { headers: headers(false) });
      log(r.status === 200 ? 'ok' : 'error', 'Search results: ' + JSON.stringify(r.data));
    }

    // Cache flush
    async function flushCache() {
      const pf = document.getElementById('cachePrefix').value.trim();
      const qs = pf ? ('?prefix=' + encodeURIComponent(pf)) : '';
      const r = await api('/cache/flush' + qs, { method: 'POST', headers: headers(true) });
      log(r.status === 200 ? 'ok' : 'error', 'Cache flush: ' + JSON.stringify(r.data));
    }

    // Redis KV demo
    async function redisSet() {
      const k = document.getElementById('kvKey').value.trim();
      const v = document.getElementById('kvValue').value;
      const ttlRaw = document.getElementById('kvTtl').value.trim();
      if (!k) { log('error', 'KV: key is required'); return; }
      const ttl = ttlRaw ? parseInt(ttlRaw, 10) : undefined;
      const body = ttl && ttl > 0 ? { value: v, ttl } : { value: v };
      const r = await api('/redis/kv/' + encodeURIComponent(k), { method: 'PUT', headers: headers(true), body: JSON.stringify(body) });
      log(r.status === 200 ? 'ok' : 'error', 'KV set: ' + JSON.stringify(r.data));
    }
    async function redisGet() {
      const k = document.getElementById('kvKey').value.trim();
      if (!k) { log('error', 'KV: key is required'); return; }
      const r = await api('/redis/kv/' + encodeURIComponent(k), { headers: headers(false) });
      log(r.status === 200 ? 'ok' : 'error', 'KV get: ' + JSON.stringify(r.data));
      if (r.status === 200 && r.data && typeof r.data.value === 'string') {
        try { document.getElementById('kvValue').value = r.data.value; } catch {}
      }
    }
    async function redisDel() {
      const k = document.getElementById('kvKey').value.trim();
      if (!k) { log('error', 'KV: key is required'); return; }
      const r = await api('/redis/kv/' + encodeURIComponent(k), { method: 'DELETE', headers: headers(true) });
      log(r.status === 200 ? 'ok' : 'error', 'KV del: ' + JSON.stringify(r.data));
    }
    async function classifyAnn(){
      const p = document.getElementById('clsMedia').value.trim() || document.getElementById('mediaPath').value.trim();
      const k = parseInt(document.getElementById('clsK').value || '10', 10);
      const f = parseInt(document.getElementById('clsFrames').value || '8', 10);
      const m = document.getElementById('clsModel').value.trim() || 'ViT-B/32';
      const s2 = document.getElementById('clsStage2').checked;
      const agg = document.getElementById('clsAgg').value || 'mean';
      const useAudio = document.getElementById('clsUseAudio').checked;
      const wv = parseFloat(document.getElementById('clsWVideo').value || '0.5');
      const wa = parseFloat(document.getElementById('clsWAudio').value || '0.2');
      try { localStorage.setItem('knot_audio_use', useAudio ? '1':'0'); localStorage.setItem('knot_audio_wv', String(wv)); localStorage.setItem('knot_audio_wa', String(wa)); } catch {}
      if (!p){ log('error','Classify: set Media Path or Upload'); return; }
      const url = '/classify/ann?video_path=' + encodeURIComponent(p) + '&k=' + k + '&frames=' + f + '&model=' + encodeURIComponent(m) + '&stage2=' + (s2?'true':'false') + '&agg=' + encodeURIComponent(agg) + '&use_audio=' + (useAudio?'true':'false') + '&w_video=' + encodeURIComponent(wv) + '&w_audio=' + encodeURIComponent(wa);
      const r = await api(url, { headers: headers(false) });
      try {
        const div = document.getElementById('clsResults');
        if (r.status === 200 && r.data && Array.isArray(r.data.results)) {
          const rows = r.data.results.map((it, idx) => `<tr><td>${idx+1}</td><td>${(it.label||'')}</td><td>${(it.score||0).toFixed(3)}</td></tr>`).join('');
          div.innerHTML = `<table style="width:100%; border-collapse:collapse"><thead><tr><th>#</th><th>Label</th><th>Score</th></tr></thead><tbody>${rows}</tbody></table>`;
          log('ok','Classify: received ' + r.data.results.length + ' results');
        } else {
          div.innerHTML = '';
          log('error','Classify: unexpected response');
        }
      } catch (e) { log('error','Classify render error: ' + e); }
    }
    function copyCurlClassify(){
      const p = (document.getElementById('clsMedia').value || document.getElementById('mediaPath').value || '').trim();
      const k = parseInt(document.getElementById('clsK').value || '10', 10);
      const f = parseInt(document.getElementById('clsFrames').value || '8', 10);
      const m = (document.getElementById('clsModel').value || 'ViT-B/32').trim();
      const s2 = document.getElementById('clsStage2').checked;
      const agg = document.getElementById('clsAgg').value || 'mean';
      const useAudio = document.getElementById('clsUseAudio').checked;
      const wv = parseFloat(document.getElementById('clsWVideo').value || '0.5');
      const wa = parseFloat(document.getElementById('clsWAudio').value || '0.2');
      const qs = '/classify/ann?video_path=' + encodeURIComponent(p) + '&k=' + k + '&frames=' + f + '&model=' + encodeURIComponent(m) + '&stage2=' + (s2?'true':'false') + '&agg=' + encodeURIComponent(agg) + '&use_audio=' + (useAudio?'true':'false') + '&w_video=' + encodeURIComponent(wv) + '&w_audio=' + encodeURIComponent(wa);
      const url = originBase() + qs;
      const parts = ['curl \"' + url + '\"'].concat(curlHeaders(false));
      copyText(parts.join(' '));
    }
    // curl helpers
    function originBase(){ return (apiBase || window.location.origin); }
    function curlHeaders(json){ const parts=[]; if(json){ parts.push('-H "Content-Type: application/json"'); } return parts; }
    function buildCurl(method, path, body){
      const url = originBase() + path;
      let parts = ['curl -X ' + method + ' "' + url + '"'];
      const headerParts = curlHeaders(!!body);
      if (headerParts.length){ parts = parts.concat(headerParts); }
      if (body){ parts.push("-d '" + JSON.stringify(body) + "'"); }
      return parts.join(' ');
    }
    async function copyText(txt){ try{ await navigator.clipboard.writeText(txt); showToast('ok','Copied curl'); }catch(e){ try{ const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); showToast('ok','Copied curl'); }catch{ showToast('error','Copy failed'); } } }
    // Copy curl actions
    function copyCurlCreateUser(){
      const username = (document.getElementById('userName').value||'').trim() || null;
      const gender = (document.getElementById('userGender').value||'').trim() || null;
      const country = document.getElementById('userCountry').value || null;
      const body = { username: username, gender: gender, country: country };
      const cmd = buildCurl('POST','/users',body);
      copyText(cmd);
    }
    function copyCurlCreatePost(){
      const creator = (document.getElementById('creator').value||'').trim();
      const description = (document.getElementById('description').value||'').trim() || null;
      const media = (document.getElementById('mediaPath').value||'').trim() || null;
      const country = document.getElementById('postCountry').value || null;
      const body = { creator: creator, description: description, media_path: media, country: country };
      const cmd = buildCurl('POST','/posts',body);
      copyText(cmd);
    }
    function copyCurlInteraction(action){
      const viewer = (document.getElementById('viewer').value||'').trim();
      const creator = (document.getElementById('author').value||'').trim();
      const post = (document.getElementById('postId').value||'').trim();
      const amount = parseFloat(document.getElementById('giftAmt').value||'0');
      const body = { viewer: viewer, creator: creator, post: post, amount: amount };
      const cmd = buildCurl('POST','/interactions/'+encodeURIComponent(action), body);
      copyText(cmd);
    }
    function copyCurlRank(){ const user=(document.getElementById('activeUser').value||'').trim(); const k=parseInt(document.getElementById('rankK').value||'20',10); const url=originBase()+('/rank?user='+encodeURIComponent(user)+'&k='+k); const parts=['curl "'+url+'"'].concat(curlHeaders(false)); copyText(parts.join(' ')); }
    function copyCurlSearch(){ const q=(document.getElementById('searchQ').value||'').trim(); const k=parseInt(document.getElementById('searchK').value||'10',10); const url=originBase()+('/search?q='+encodeURIComponent(q)+'&k='+k); const parts=['curl "'+url+'"'].concat(curlHeaders(false)); copyText(parts.join(' ')); }
    function copyCurlFlush(){ const pf=(document.getElementById('cachePrefix').value||'').trim(); const qs=pf?('?prefix='+encodeURIComponent(pf)) : ''; const url=originBase()+'/cache/flush'+qs; const parts=['curl -X POST "'+url+'"'].concat(curlHeaders(false)); copyText(parts.join(' ')); }
    function copyCurlKvSet(){
      const k = (document.getElementById('kvKey').value||'').trim();
      const v = document.getElementById('kvValue').value;
      const ttlRaw = (document.getElementById('kvTtl').value||'').trim();
      const ttl = ttlRaw ? parseInt(ttlRaw,10) : undefined;
      const body = ttl ? { value: v, ttl: ttl } : { value: v };
      const cmd = buildCurl('PUT','/redis/kv/'+encodeURIComponent(k), body);
      copyText(cmd);
    }
    function copyCurlKvGet(){ const k=(document.getElementById('kvKey').value||'').trim(); const url=originBase()+('/redis/kv/'+encodeURIComponent(k)); const parts=['curl "'+url+'"'].concat(curlHeaders(false)); copyText(parts.join(' ')); }
    function copyCurlKvDel(){ const k=(document.getElementById('kvKey').value||'').trim(); const url=originBase()+('/redis/kv/'+encodeURIComponent(k)); const parts=['curl -X DELETE "'+url+'"'].concat(curlHeaders(false)); copyText(parts.join(' ')); }
// Initialize preferences
  window.addEventListener('load', () => {
    try {
      ensurePanelIds();
      attachCollapsers();
      loadPanelState();
      const c = (localStorage.getItem('knot_compact') === '1');
      applyCompact(c);
      const chk = document.getElementById('compactToggle');
      if (chk) chk.checked = c;
      const t = localStorage.getItem('knot_theme') || 'light';
      applyTheme(t);
      const th = document.getElementById('themeToggle');
      if (th) th.checked = (t !== 'light');
      const at = (localStorage.getItem('knot_auto_tree') === '1');
      const atEl = document.getElementById('autoTree');
      if (atEl) atEl.checked = at;
      if (at) { try { loadTree(); } catch {} }
      const acc = (localStorage.getItem('knot_accordion')==='1');
      const accEl = document.getElementById('accordionToggle');
      if(accEl) accEl.checked = acc;
    } catch {}
  });
  </script>
  </head>
  <body>
    <div class="container">
    <h1>Knot-Labs Web UI</h1>
    <fieldset>
      <legend>UI Preferences</legend>
      <div class="row"><label>Dark Mode</label>

        <input type="checkbox" id="compactToggle" onchange="onCompactToggle(this)" />

        <button onclick="resetUI()">Reset UI</button>

          <option value="IN">India</option>
          <option value="JP">Japan</option>
          <option value="KR">South Korea</option>
          <option value="AU">Australia</option>

      <div class="row"><label>Media File(s)</label><input type="file" id="mediaFile" multiple /></div>
      <div class="row"><label>Country</label><select id="postCountry">
          <option value="">Auto</option>
          <option value="US">United States</option>
          <option value="CA">Canada</option>
          <option value="GB">United Kingdom</option>
          <option value="DE">Germany</option>
          <option value="FR">France</option>
          <option value="BR">Brazil</option>
          <option value="IN">India</option>
          <option value="JP">Japan</option>
          <option value="KR">South Korea</option>
          <option value="AU">Australia</option>
          <option value="MX">Mexico</option>
          <option value="ID">Indonesia</option>
          <option value="NG">Nigeria</option>
          <option value="ZA">South Africa</option>
          <option value="EG">Egypt</option>

          <option value="ES">Spain</option>
          <option value="NL">Netherlands</option>
          <option value="SE">Sweden</option>
          <option value="NO">Norway</option>
        </select></div>
      <div class="row"><button onclick="createPostAnalyze()">Post</button><button onclick="copyCurlCreatePost()">Copy curl</button></div>
    </fieldset>

    <fieldset>
      <legend>Preview</legend>
      <div class="row"><a id="previewLink" href="#" target="_blank" class="muted" style="display:none">Open in new tab</a></div>
      <div id="previewPane">
        <video id="previewVideo" style="display:none" controls></video>
        <audio id="previewAudio" style="display:none" controls></audio>
        <img id="previewImage" style="display:none" alt="preview" />
      </div>
    </fieldset>

    <fieldset>
      <legend>Interactions</legend>
      <div class="row"><label>Viewer ID</label><input type="text" id="viewer" /></div>
      <div class="row"><label>Author ID</label><input type="text" id="author" /></div>
      <div class="row"><label>Post ID</label><input type="text" id="postId" /></div>
      <div class="row"><label>Amount</label><input type="number" id="giftAmt" value="1" min="1" /></div>
      <div class="row">
        <button onclick="interact('like')">Like</button>
        <button onclick="interact('comment')">Comment</button>
        <button onclick="interact('share')">Share</button>
        <button onclick="interact('gift')">Gift</button>
      </div>
    </fieldset>

    <fieldset>
      <legend>Rank</legend>
      <div class="row"><label>User</label><input type="text" id="activeUser" /></div>
      <div class="row"><label>Top K</label><input type="number" id="rankK" value="20" min="1" /></div>
      <div class="row"><button onclick="rankUser()">Rank</button><button onclick="copyCurlRank()">Copy curl</button></div>

    <fieldset>
      <legend>Search</legend>
      <div class="row"><label>Query</label><input type="text" id="searchQ" /></div>
