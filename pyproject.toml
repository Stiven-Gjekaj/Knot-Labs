[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
select = ["E","F","I","UP","B"]
ignore = []
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
strict_optional = false

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "knot-labs"
version = "0.1.0"
description = "Knot Labs project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic>=1.10",
]

[tool.setuptools]
packages = [
    "api",
    "Mesh",
    "Veil",
    "Drift",
    "Scribe",
    "indexes",
    "veil",
]

